[project]
name = "agentic-workflow-visualizer"
version = "0.1.0"
description = "Real-time browser dashboard for visualizing Codex agent workflow activity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
start = "scripts.visualize:main"
server = "server.main:run"
hook = "hooks.codex_hook:main"
install = "scripts.install_hook:main"
uninstall = "scripts.uninstall_hook:main"

[tool.setuptools.packages.find]
include = ["server", "scripts", "ui", "hooks"]

[tool.setuptools.package-data]
ui = ["*.html", "*.css", "*.js"]
hooks = ["*.py"]

